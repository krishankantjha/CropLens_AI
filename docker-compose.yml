services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: croplens_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY before starting the production backend}
      - CORS_ORIGINS=${CORS_ORIGINS:?Set CORS_ORIGINS to the deployed frontend origin}
      - REDIS_URL=${REDIS_URL:?Set REDIS_URL to a production Redis instance}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-true}
      - AUTH_COOKIE_SAMESITE=${AUTH_COOKIE_SAMESITE:-lax}
      - DATABASE_URL=sqlite:////app/backend/app/croplens.db
      - MODEL_REGISTRY_PATH=/app/backend/app/models/registry.json
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./backend/app/croplens.db:/app/backend/app/croplens.db
      # Provision backend/app/models on the host; model binaries stay outside Git.
      - ./backend/app/models:/app/backend/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - croplens_network

networks:
  croplens_network:
    driver: bridge

