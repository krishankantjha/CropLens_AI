services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: croplens_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./backend/app/croplens.db:/app/backend/app/croplens.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - croplens_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: croplens_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - croplens_network

networks:
  croplens_network:
    driver: bridge

